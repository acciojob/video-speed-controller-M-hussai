<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Video Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .player {
      max-width: 750px;
      border: 5px solid rgba(0,0,0,0.2);
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      position: relative;
      font-size: 0;
      overflow: hidden;
      background: #000;
    }

    .player__video {
      width: 100%;
      display: block;
    }

    .player__controls {
      display: flex;
      position: absolute;
      bottom: 0;
      width: 100%;
      transform: translateY(100%);
      transition: all 0.3s;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.6);
    }

    .player:hover .player__controls {
      transform: translateY(0);
    }

    .progress {
      flex: 100%;
      position: relative;
      display: flex;
      flex-basis: 100%;
      height: 10px;
      background: rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .progress__filled {
      width: 0%;
      background: #ff0000;
      flex-0: 0;
      flex-basis: 0%;
    }

    .player__button {
      background: none;
      border: 0;
      line-height: 1;
      color: white;
      text-align: center;
      outline: 0;
      padding: 10px;
      cursor: pointer;
      max-width: 50px;
      font-size: 14px;
    }

    .player__slider {
      width: 10px;
      height: 30px;
    }

    .player__controls > * {
      flex: 1;
    }

    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
      width: 100%;
      margin: 0 5px;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8.4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 1.3px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 15px;
      width: 15px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -3.5px;
    }
  </style>
</head>
<body>

  <div class="player">
    <video class="player__video viewer" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

    <div class="player__controls">
      <div class="progress">
        <div class="progress__filled"></div>
      </div>

      <button class="player__button toggle" title="Toggle Play">►</button>

      <input type="range" name="volume" class="player__slider volume" min="0" max="1" step="0.05" value="1">
      <input type="range" name="playbackRate" class="player__slider playbackSpeed" min="0.5" max="2" step="0.1" value="1">

      <button data-skip="-10" class="player__button rewind">« 10s</button>
      <button data-skip="25" class="player__button skip">25s »</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
